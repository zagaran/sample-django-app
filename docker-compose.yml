services:
  redis:
    image: redis
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:18
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  redis-data:
  postgres-data:
