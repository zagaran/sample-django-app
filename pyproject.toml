[project]
name = "sample-django-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery-redbeat>=2.4.2",
    "celery[redis]>=5.6.3",
    "crispy-bootstrap5>=2026.9",
    "django==5.2.*",
    "django-attachments-framework",
    "django-compressor>=4.6.0",
    "django-crispy-forms>=2.7",
    "django-environ>=0.14.0",
    "django-extensions>=3.2",
    "django-react-components>=1.1.0",
    "django-sass-processor>=1.4.2",
    "django-ses>=4.8.0",
    "django-storages>=1.14.6",
    "django-webpack-loader==0.7.0",
    "gunicorn>=26.2.0",
    "ipython>=9.17.1",
    "libsass>=0.23.0",
    "psycopg2>=2.9.13",
    "requests>=2.34.2",
    "sentry-sdk>=2.71.0",
    "social-auth-app-django>=6.0.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-debug-toolbar>=8.0.0",
    "flake8>=7.4.1",
    "isort>=9.0.2",
    "pip-tools>=7.6.1",
    "pre-commit>=4.6.2",
    "pygit2>=1.20.1",
    "rich>=15.0.0",
    "werkzeug>=3.1.9",
]

[tool.uv.sources]
django-attachments-framework = { path = "../django-attachments-framework", editable = true }
